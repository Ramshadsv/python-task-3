<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student – StudentManager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="navbar">
  <a href="/dashboard" class="brand">StudentManager</a>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/students">Students</a>
    <a href="/add-student" class="active">Add Student</a>
    <a href="/logout">Logout</a>
  </nav>
</div>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <div class="card" style="max-width:500px;margin:0 auto">
    <div class="card-header"><h2>Add New Student</h2></div>
    <form method="POST" action="/add-student">
      <div class="form-group">
        <label>Full Name</label>
        <input name="name" placeholder="e.g. Rahul Sharma" required autofocus>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="e.g. rahul@email.com" required>
      </div>
      <div class="form-group">
        <label>Course</label>
        <input name="course" placeholder="e.g. Python Full Stack" required>
      </div>
      <div class="row">
        <button class="btn btn-primary" type="submit">Save Student</button>
        <a href="/students" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
